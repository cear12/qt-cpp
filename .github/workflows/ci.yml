name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cmake:
    uses: cear12/ci-workflows/.github/workflows/cmake.yml@v1
    with:
      # Qt comes from apt, so Linux only (the code itself is portable).
      os: '["ubuntu-latest"]'
      apt-packages: >-
        qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-tools-dev
        qt6-scxml-dev libqt6opengl6-dev libgl1-mesa-dev
      # Qt keeps process-lifetime allocations that LeakSanitizer reports as
      # leaks; the demos are smoke tests, not a sanitizer target.
      sanitizers: ""
